name: HW Agent External Run

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 使用 UTC；台灣時間 = UTC + 8
    # 每小時第 10 分鐘執行一次，避開整點高峰
    - cron: "10 * * * *"

concurrency:
  group: hw-agent-external-run
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger PythonAnywhere guarded runner
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST \
            -H "X-Agent-Trigger-Key: ${{ secrets.AGENT_EXTERNAL_TRIGGER_KEY }}" \
            "https://promptgallery.pythonanywhere.com/hwaistudio-test/agent-flow/external-run")"

          echo "HTTP_CODE=$HTTP_CODE"
          cat "$RESPONSE_FILE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
